name: repo-smoke

on:
  push:
  pull_request:

jobs:
  layout-and-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required paths exist
        run: |
          set -euo pipefail
          test -f main.m
          test -f scripts/define_chemotherapy_problem.m
          test -f scripts/solveOCP.m
          test -f configs/paper_cost_weights.m
          test -f configs/reproducibility_settings.m
          test -f configs/reference_metrics.m
          test -f tests/run_smoke_tests.m
          test -f docs/REPRODUCIBILITY.md
          test -f results/reference/README.md
          test -f CITATION.cff
          test -f LICENSE

      - name: Paper cost weights present
        run: |
          set -euo pipefail
          grep -q "alpha_vec.*=.*5" configs/paper_cost_weights.m
          grep -q "beta_vec.*=.*400" configs/paper_cost_weights.m
          grep -q "gamma1.*=.*4000" configs/paper_cost_weights.m
          # Guard against accidental default drift back to experimental values
          ! grep -E "alpha_vec\s*=\s*1\s*\*" scripts/define_chemotherapy_problem.m
          ! grep -E "beta_vec\s*=\s*0\.1" scripts/define_chemotherapy_problem.m
          ! grep -E "gamma1\s*=\s*20\s*;" scripts/define_chemotherapy_problem.m

      - name: Reference pin documented
        run: |
          set -euo pipefail
          grep -q "270530.1263" configs/reference_metrics.m
          test -f results/reference/single_solution.mat
